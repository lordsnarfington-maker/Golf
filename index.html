<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1D6A3A">
<title>Golf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D6A3A'/%3E%3Cpath d='M26 12v40' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M28 13l20 8-20 8z' fill='%23E27B1E'/%3E%3Cellipse cx='32' cy='52' rx='16' ry='4' fill='%234FAE67'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF1E8; --surface:#FFFFFF; --surface-2:#E2E8DC; --ink:#142018; --muted:#58685C; --line:#C9D3C3;
  --accent:#1D6A3A; --accent-ink:#FFFFFF; --accent-soft:#D5E8D9;
  --t-blue:#2F7FC0; --t-green:#3E9656; --t-silver:#A7AFB5; --t-white:#F7F7F2; --t-black:#1E1E1E; --t-brass:#B5A642; --t-bronze:#B0703A; --t-auburn:#9A3B2E; --t-gold:#D4AF37; --t-hybrid:#8E9AA0; --t-red:#C8453A;
  --rough:#A9CBA0; --green:#4FAE67; --fair:#86C07A; --sand:#EAD8A3; --water:#4A8FCB; --teebox:#A4D796; --mapline:#FFFFFF;
  --good:#1D6A3A; --warn:#B8621B; --bad:#A63A2E;
  --font-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --font-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1611; --surface:#16211A; --surface-2:#1E2B22; --ink:#E6EEE5; --muted:#98A99B; --line:#2B3A2F;
  --accent:#57C47A; --accent-ink:#06140B; --accent-soft:#1D3A26;
  --rough:#1F3B25; --green:#3E9656; --fair:#2C5733; --sand:#A99661; --water:#2E6A9C; --teebox:#3A6B40; --mapline:#E6EEE5;
  --good:#57C47A; --warn:#E39A52; --bad:#E07565;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1611; --surface:#16211A; --surface-2:#1E2B22; --ink:#E6EEE5; --muted:#98A99B; --line:#2B3A2F;
  --accent:#57C47A; --accent-ink:#06140B; --accent-soft:#1D3A26;
  --rough:#1F3B25; --green:#3E9656; --fair:#2C5733; --sand:#A99661; --water:#2E6A9C; --teebox:#3A6B40; --mapline:#E6EEE5;
  --good:#57C47A; --warn:#E39A52; --bad:#E07565;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
h1,h2,h3{font-family:var(--font-d);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;line-height:1}
h2{font-size:22px}
.eyebrow{font-family:var(--font-d);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--font-d);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel.alert{border:2px solid var(--warn)}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}

/* choosers */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.opt b{font-family:var(--font-d);font-size:20px;line-height:1.1}
.opt small{color:var(--muted)}
.teechip{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid rgba(0,0,0,.25)}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toggle2 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:46px;font-weight:600}
.toggle2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-d);font-size:28px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* lists */
.rlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.ritem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.ritem:last-child{border-bottom:0}
.ritem .score{font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1;grid-row:span 2;align-self:center;font-variant-numeric:tabular-nums}
.ritem small{color:var(--muted)}

/* hole view */
.holehead{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px}
.holehead .mid{text-align:center}
.nav{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:700}
.holecard{position:relative;overflow:hidden;border-radius:18px;background:var(--rough);border:1px solid var(--line);padding:18px 18px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center}
.holecard .big{font-family:var(--font-d);font-size:92px;font-weight:700;line-height:.8;grid-row:span 2;font-variant-numeric:tabular-nums}
.holecard .of{font-family:var(--font-d);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.holecard .facts{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-d);font-size:18px;font-weight:600}
.holecard .facts span{display:flex;flex-direction:column;line-height:1.05}
.holecard .facts small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.holecard .facts b{font-size:28px}
.holecard svg{position:absolute;right:-6px;bottom:-4px;width:120px;height:120px;opacity:.55;pointer-events:none}
.holecard.slim{padding:12px 16px}
.holecard.slim .big{font-size:60px}
.hmap{position:relative;margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--rough);height:min(46vh,420px)}
.hmap svg{display:block;width:100%;height:100%}
.hmap .attr{position:absolute;right:6px;bottom:4px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:1px 5px;border-radius:4px}
.mw{fill:var(--water)} .mf{fill:var(--fair)} .mb{fill:var(--sand)}
.mtb{fill:var(--teebox);stroke:var(--mapline);stroke-width:1;vector-effect:non-scaling-stroke}
.mg{fill:var(--green);stroke:var(--mapline);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mp{fill:none;stroke:var(--mapline);stroke-width:2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;opacity:.85}
.mpole{stroke:var(--mapline);stroke-width:2;vector-effect:non-scaling-stroke}
.mk100,.mk150,.mk200{stroke:#142018;stroke-width:1;vector-effect:non-scaling-stroke}
.mk100{fill:#D23B2E} .mk150{fill:#FFFFFF} .mk200{fill:#2F7FC0}
.mtx{fill:#fff;font-family:var(--font-d);font-weight:700;paint-order:stroke;stroke:#142018;stroke-width:3px}
.parpick{display:flex;align-items:center;gap:6px;margin-top:10px}
.parpick span{font-weight:600;margin-right:4px}
.parpick button{width:52px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-d);font-size:22px;font-weight:700}
.parpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.entry{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.erow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .lbl{font-weight:600}
.erow .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.me{background:var(--accent-soft)}
.pname{padding:12px 12px 2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pname strong{font-family:var(--font-d);font-size:22px}
.more{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:38px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:600;line-height:1}
.stepper output{min-width:48px;text-align:center;font-family:var(--font-d);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.stepper.sm button{width:44px;height:44px;font-size:20px}
.stepper.sm output{min-width:40px;font-size:26px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 12px 12px;border-bottom:1px solid var(--line)}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;font-size:13px;font-weight:600;padding:4px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seglbl{padding:10px 12px 0;font-weight:600}
.guest{border-top:6px solid var(--bg)}

/* scorecard */
.cardscroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.sc{border-collapse:collapse;font-family:var(--font-d);font-variant-numeric:tabular-nums;font-size:16px;min-width:100%}
.sc th,.sc td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 4px;text-align:center;min-width:32px}
.sc th:first-child,.sc td:first-child{text-align:left;padding-left:10px;min-width:74px;position:sticky;left:0;background:var(--surface);font-weight:600;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.sc tr.h th{background:var(--ink);color:var(--bg)}
.sc tr.h th:first-child{background:var(--ink)}
.sc tr.h th button{all:unset;cursor:pointer;display:block;width:100%}
.sc tr.o td{color:var(--muted);font-size:14px}
.sc tr.mine td{font-weight:700;font-size:18px}
.sc td.tot{font-weight:700;background:var(--surface-2)}
.sc td.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.mk{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center}
.mk.bird{border:2px solid var(--good);border-radius:50%}
.mk.eagle{border:2px solid var(--good);border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--good)}
.mk.bog{border:1.5px solid var(--muted)}
.mk.dbl{border:1.5px solid var(--bad);color:var(--bad)}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv span{font-size:14px;background:var(--surface-2);border-radius:8px;padding:6px 10px}
.kv b{font-family:var(--font-d);font-size:17px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.bar nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:560px}
/* stats */
.hb{display:grid;grid-template-columns:92px 1fr 56px;align-items:center;gap:8px;font-size:14px}
.hb .tr{height:14px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.hb .fl{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--accent)}
.hb .fl.warn{background:var(--warn)}
.hb .fl.dim{background:var(--muted);opacity:.55}
.hb .v{text-align:right;font-family:var(--font-d);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.stk{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.stk span{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg b{color:var(--ink);font-family:var(--font-d);font-size:15px}
.ins{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.trend{width:100%;height:170px;display:block}
.trend .ax{stroke:var(--line);stroke-width:1}
.trend .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trend .dt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.trend text{fill:var(--muted);font-size:11px;font-family:var(--font-b)}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--muted);font-weight:500}
.cmp th{font-family:var(--font-d);font-size:16px}
.cmp td b{font-family:var(--font-d);font-size:17px}
.cmp tr:last-child td{border-bottom:0}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
.bar button{border:0;background:transparent;border-radius:10px;padding:8px 4px;font-family:var(--font-d);font-size:16px;font-weight:600;letter-spacing:.04em;color:var(--muted);min-height:48px}
.bar button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.bar button:disabled{opacity:.35}
.confirm{border:1px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;font-size:14px}
@media (prefers-reduced-motion:no-preference){.btn,.stepper button,.seg button,.parpick button{transition:transform .08s}.btn:active,.stepper button:active,.seg button:active,.parpick button:active{transform:scale(.96)}}
</style>
</head><body>
<div id="app"></div>
<div class="bar"><nav id="nav" aria-label="Sections"></nav></div>
<div id="toast" class="toast" hidden></div>

<script>
/* =========================================================
   Golf card app — v2 (card-first)
   Storage keys: bl_rounds, bl_pending, bl_tees (unchanged)
   New keys:     bl_courses (saved courses), bl_guests (guest profiles),
                 bl_pick (last course picked), bl_backup_at (last backup time)
   Round shape is unchanged; new rounds also carry:
     card: snapshot of the course card (name, par[], yards[], hcp[], tee info)
     holes[i].og[k]: {p,pen,ts} extra stats for guest k (strokes stay in holes[i].o[k])
   Old rounds without `card` read their card from the built-in course.
   ========================================================= */
const APP_VERSION="2.5";
let ME="Matt"; /* the phone owner's name; set from bl_me below */

/* Built-in courses. Brae Loch tee keys stay "orange/yellow/blue" so old rounds keep working;
   only the labels changed to the course's current tee colors. */
const BUILTIN={
  "brae-loch":{

    hcp:[5,13,9,7,15,1,3,11,17, 6,12,18,4,2,14,10,16,8],
    note:"Fairway markers measure to the middle of the green: red 100, white 150, blue 200.",
    teeOrder:["orange","yellow","blue"],
    tees:{
      orange:{label:"Blue",color:"var(--t-blue)",yards:[409,203,309,372,158,559,512,291,253, 396,314,124,487,405,185,395,161,358],rating:67.9,slope:117},
      yellow:{label:"Green",color:"var(--t-green)",yards:[400,198,289,330,150,443,452,281,242, 370,280,114,411,330,141,386,148,332],rating:65.4,slope:111},
      blue:{label:"Silver",color:"var(--t-silver)",yards:[180,95,145,175,75,225,205,140,120, 180,150,60,205,165,75,180,80,170],rating:null,slope:null}
    }
  },
  /* Official course scorecard (petrifyingspringsgolf.com), matches GolfPass. White tees only:
     the forward Orange tees use different pars on 17-18 and their printed totals don't add up. */
  "petrifying-springs":{
    id:"petrifying-springs", name:"Petrifying Springs", place:"Kenosha, WI", builtin:true,
    par:[4,3,4,3,4,4,4,5,5, 4,4,3,4,4,4,3,4,4],
    hcp:[5,13,9,15,17,11,7,1,3, 12,10,18,8,14,16,6,4,2],
    teeOrder:["white"],
    tees:{
      white:{label:"White",color:"var(--t-white)",yards:[336,272,383,167,268,329,354,492,476, 304,350,152,417,367,307,189,419,437],rating:67.8,slope:119}
    }
  },
  /* Official scorecard images (thunderhawkgolfclub.org), cross-checked with GolfPass and 18Birdies.
     Auburn has no men's rating on the official card, so it doesn't count toward the handicap. */
  "thunderhawk":{
    id:"thunderhawk", name:"ThunderHawk", place:"Beach Park, IL", builtin:true,
    par:[4,5,3,4,4,3,5,4,4, 4,5,4,3,4,3,5,3,5],
    hcp:[17,5,9,3,7,11,15,13,1, 14,16,4,8,12,18,2,10,6],
    teeOrder:["black","brass","bronze","silver","auburn"], defaultTee:"silver",
    tees:{
      black:{label:"Black",color:"var(--t-black)",yards:[414,573,212,446,416,178,522,338,481, 429,517,385,225,363,172,578,182,600],rating:74.2,slope:141},
      brass:{label:"Brass",color:"var(--t-brass)",yards:[394,554,187,424,391,168,501,333,452, 409,512,363,200,317,145,568,154,559],rating:72.4,slope:137},
      bronze:{label:"Bronze",color:"var(--t-bronze)",yards:[369,534,187,394,391,168,470,333,417, 362,512,363,160,317,172,568,130,514],rating:71.2,slope:134},
      silver:{label:"Silver",color:"var(--t-silver)",yards:[369,534,153,394,379,138,470,302,417, 362,503,331,160,276,134,558,130,514],rating:70.1,slope:131},
      auburn:{label:"Auburn",color:"var(--t-auburn)",yards:[298,453,95,309,326,90,422,254,378, 299,444,241,120,246,66,401,106,498],rating:null,slope:null}
    }
  },
  /* 2026 official scorecard (shepherdscrook.org), cross-checked with GolfPass. */
  "shepherds-crook":{
    id:"shepherds-crook", name:"Shepherd's Crook", place:"Zion, IL", builtin:true,
    par:[4,4,4,3,4,4,4,3,5, 4,3,4,4,5,4,3,4,5],

    card={name:c.name,place:c.place||"",par:c.par.slice(),hcp:c.hcp?c.hcp.slice():null,yards:t?t.yards.slice():null,

  }
  const r={id,course:c?c.id:null,tees:c?teesKey:null,date:new Date().toISOString(),status:"active",
    players:[ME,...S.newPlayers],card,

/* handicap (World Handicap System method, unofficial). Only full 18-hole rounds on rated tees count. */
function hiFrom(diffs){
  const n=diffs.length; if(n<3) return null;
  const last=diffs.slice(-20).slice().sort((a,b)=>a-b);
  const t={3:[1,-2],4:[1,-1],5:[1,0],6:[2,-1],7:[2,0],8:[2,0],9:[3,0],10:[3,0],11:[3,0],12:[4,0],13:[4,0],14:[4,0],15:[5,0],16:[5,0],17:[6,0],18:[6,0],19:[7,0]};
  const [k,adj]=t[Math.min(n,20)]||[8,0];
  const avg=last.slice(0,k).reduce((a,b)=>a+b,0)/k;
  return Math.min(54,Math.round((avg+adj)*10)/10);
}
function strokesOn(ch,hcpIdx){if(ch==null||!hcpIdx)return 0;let s=Math.floor(ch/18);if(hcpIdx<=ch%18)s++;return s}
function handicapHistory(){
  const done=liveRounds().filter(r=>{const c=cardOf(r);return r.status==="done"&&complete(r)&&nHoles(r)===18&&c.rating&&c.slope}).sort((a,b)=>a.date.localeCompare(b.date));
  const diffs=[]; const byId={};
  done.forEach(r=>{
    const c=cardOf(r); const hi=hiFrom(diffs);
    const ch=hi==null?null:Math.round(hi*c.slope/113+(c.rating-parTotal(r)));
    const ags=r.holes.reduce((a,h,i)=>{const p=parOf(r,i);const cap=hi==null?p+5:p+2+strokesOn(ch,c.hcp?c.hcp[i]:0);return a+Math.min(h.s,cap)},0);

const centroid=a=>a.reduce((s,p)=>[s[0]+p[0]/a.length,s[1]+p[1]/a.length],[0,0]);
function mapSVG(m,par){
  const all=[...m.p]; m.g.forEach(g=>all.push(...g));
  m.t.forEach(t=>{const c=centroid(t); if(Math.abs(c[0])<40&&c[1]<40) all.push(...t)});
  let x0=Math.min(...all.map(p=>p[0]))-30, x1=Math.max(...all.map(p=>p[0]))+30;
  const y0=Math.min(...all.map(p=>p[1]))-18, y1=Math.max(...all.map(p=>p[1]))+24;
  let W=x1-x0; const H=y1-y0; const minW=H*0.62; if(W<minW){const c=(x0+x1)/2;x0=c-minW/2;W=minW}

  const line=[...m.p.slice(0,-1),gc];
  const fs=Math.max(9,W/20);
  const at=d=>{for(let k=line.length-1;k>0;k--){const a=line[k],b=line[k-1],l=Math.hypot(b[0]-a[0],b[1]-a[1]); if(d<=l) return [a[0]+(b[0]-a[0])*d/l,a[1]+(b[1]-a[1])*d/l]; d-=l} return null};
  const marks=par>3?[100,150,200].map(d=>{const q=at(d); if(!q||q[1]<30) return "";
    return `<circle cx="${q[0].toFixed(1)}" cy="${(-q[1]).toFixed(1)}" r="${(fs*0.33).toFixed(1)}" class="mk${d}"/><text x="${(q[0]+fs*0.6).toFixed(1)}" y="${(-q[1]+fs*0.35).toFixed(1)}" font-size="${fs.toFixed(1)}" class="mtx">${d}</text>`}).join(""):"";
  return `<svg viewBox="${x0.toFixed(1)} ${(-y1).toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of the hole, tee at the bottom and green at the top">
    <rect x="${(x0-3000).toFixed(1)}" y="${(-y1-3000).toFixed(1)}" width="${(W+6000).toFixed(1)}" height="${(H+6000).toFixed(1)}" fill="var(--rough)"/>
    ${m.w.map(a=>poly(a,"mw")).join("")}${m.f.map(a=>poly(a,"mf")).join("")}${m.t.map(a=>poly(a,"mtb")).join("")}${m.b.map(a=>poly(a,"mb")).join("")}${m.g.map(a=>poly(a,"mg")).join("")}
    <polyline points="${line.map(pt).join(" ")}" class="mp"/>${marks}
    <line x1="${gc[0].toFixed(1)}" y1="${(-gc[1]).toFixed(1)}" x2="${gc[0].toFixed(1)}" y2="${(-gc[1]-fs*1.6).toFixed(1)}" class="mpole"/>
    <path d="M${gc[0].toFixed(1)} ${(-gc[1]-fs*1.6).toFixed(1)} l${fs.toFixed(1)} ${(fs*0.35).toFixed(1)} l${(-fs).toFixed(1)} ${(fs*0.35).toFixed(1)}z" fill="var(--bad)"/>
  </svg>`;
}

  if(n){
    const bp=byParType(r); const fwT=r.holes.filter((x,i)=>parOf(r,i)>3&&x.ts).length, fwH=r.holes.filter((x,i)=>parOf(r,i)>3&&x.ts==="F").length;
    const p3T=r.holes.filter((x,i)=>parOf(r,i)===3&&x.ts).length, p3H=r.holes.filter((x,i)=>parOf(r,i)===3&&x.ts==="G").length;
    const pen=r.holes.reduce((a,x)=>a+(x.pen||0),0), three=r.holes.filter(x=>x.p>=3).length;
    h+=`<div class="kv">${[3,4,5].filter(p=>bp[p][1]).map(p=>`<span>Par ${p}s <b>${toPar(bp[p][0])}</b></span>`).join("")}
      ${fwT?`<span>Fairways <b>${fwH}/${fwT}</b></span>`:""}${p3T?`<span>Par 3 greens <b>${p3H}/${p3T}</b></span>`:""}
      <span>3-putts <b>${three}</b></span><span>Penalties <b>${pen}</b></span></div>`;
  }
  h+=`<div class="section">${nh===18?half(0,9)+half(9,9):half(0,nh)}</div>`;
  if(r.players.length>1) h+=`<div class="section"><div class="rlist">${r.players.map((p,k)=>{const tot=k===0?myTotal(r):oTotal(r,k-1);const pt=k===0?parThru(r):oParThru(r,k-1);return `<div class="ritem" style="cursor:default"><strong>${esc(p)}</strong><div class="score">${tot||"–"}</div><small>${tot?toPar(tot-pt):""}</small></div>`}).join("")}</div></div>`;
  h+=`<div class="section">`;
  if(isActive){
    h+=complete(r)?`<button class="btn primary block" data-act="finish">Finish round and save</button>`:`<button class="btn block" data-act="finish">Finish round early (${n} of ${nh})</button><div class="note">Only full 18-hole rounds on rated tees count toward your handicap.</div>`;
  } else {
    if(c.blank&&!r.course){
      h+=`<div class="panel stack"><div><strong>Save this card as a course?</strong><div class="note">Next time you play here, pick it from the list and the pars are already set.</div></div>
        <input type="text" id="scname" value="${esc(c.name==="Blank card"?"":c.name)}" placeholder="Course name" maxlength="40" autocomplete="off">
        <input type="text" id="scplace" placeholder="Town (optional)" maxlength="40" autocomplete="off">
        <button class="btn primary" data-act="savecourse" data-id="${r.id}">Save course</button></div>`;
    }
    h+=`<button class="btn block" data-act="reopen">Edit this round</button>`;
  }
  if(S.confirm==="del"+r.id) h+=`<div class="confirm"><strong>Delete this round?</strong><span class="note">It's removed from your history and stats.</span><div class="row"><button class="btn danger" data-act="del" data-id="${r.id}">Delete round</button><button class="btn ghost" data-act="cancel">Keep it</button></div></div>`;
  else h+=`<button class="btn ghost block" data-act="askdel" data-id="${r.id}" style="color:var(--bad)">Delete round</button>`;
  h+=`</div>`;
  if(!isActive) h=backupNag()+h;
  return h;
}

function historyView(){
  const keys={}; doneRounds().forEach(r=>{keys[courseKey(r)]=courseName(r)});
  if(S.filter!=="all"&&!keys[S.filter]) S.filter="all";
  const rs=doneRounds(S.filter).sort((a,b)=>b.date.localeCompare(a.date));
  const st=myStats(S.filter), hc=handicapHistory();
  let h=header("History","Your golf card");
  if(Object.keys(keys).length>1) h+=`<div class="section"><div class="row"><button class="chip" data-act="filter" data-v="all" aria-pressed="${S.filter==="all"}">All courses</button>${Object.entries(keys).map(([k,n])=>`<button class="chip" data-act="filter" data-v="${esc(k)}" aria-pressed="${S.filter===k}">${esc(n)}</button>`).join("")}</div></div>`;
  h+=`<div class="section"><div class="stats"><div class="stat"><b>${rs.length}</b><span>Rounds</span></div><div class="stat"><b>${st&&st.best!=null?st.best:"—"}</b><span>Best 18</span></div><div class="stat"><b>${S.filter==="all"?(hc.hi!=null?hc.hi.toFixed(1):"—"):(st&&st.avg!=null?st.avg.toFixed(1):"—")}</b><span>${S.filter==="all"?"Handicap*":"Average 18"}</span></div></div></div>`;
  h+=`<div class="section">${rs.length?roundList(rs):`<div class="panel muted">No finished rounds yet.</div>`}</div>`;
  const fc=S.filter!=="all"&&allCourses()[S.filter];
  if(fc&&rs.length){
    const par=fc.par;
    h+=`<div class="section"><div class="eyebrow">Your average by hole · ${esc(fc.name)}</div><div class="cardscroll"><table class="sc"><tr class="h"><th>Hole</th>${par.map((_,i)=>`<th>${i+1}</th>`).join("")}</tr><tr><td>Par</td>${par.map(p=>`<td>${p}</td>`).join("")}</tr><tr class="mine"><td>Avg</td>${par.map((p,i)=>{const a=holeAvg(S.filter,i);return `<td style="${a&&a.avg-p>=2?"color:var(--bad)":""}">${a?a.avg.toFixed(1):""}</td>`}).join("")}</tr></table></div><div class="note">Red marks holes where you average double bogey or worse.</div></div>`;
  }
  const people=allGuestNames().map(guestStats).filter(g=>g.rounds);
  if(people.length){
    h+=`<div class="section"><div class="spread"><div class="eyebrow">Playing partners</div><button class="chip" data-act="go" data-v="players">Manage</button></div>${partnerList(people)}</div>`;
  }
  const uc=Object.values(S.courses);
  if(uc.length){
    h+=`<div class="section"><div class="eyebrow">Your saved courses</div><div class="rlist">${uc.map(x=>`<div class="ritem" style="cursor:default"><div><strong>${esc(x.name)}</strong></div><div></div><small>${esc(x.place||"")}${x.place?" · ":""}${x.par.length} holes · par ${x.par.reduce((a,b)=>a+b,0)}</small></div>`).join("")}</div></div>`;
  }
  h+=`<div class="section"><div class="eyebrow">Your name</div><div class="panel stack"><div class="row" style="flex-wrap:nowrap"><input type="text" id="mename" value="${esc(ME)}" maxlength="24" autocomplete="off"><button class="btn" data-act="setme">Save</button></div><div class="note">You're always Player 1. Changing your name updates all your rounds.</div></div></div>`;
  h+=`<div class="section"><div class="eyebrow">Backup</div><div class="panel stack">
    <div class="note">Rounds are saved only on this phone. Copy the backup text and paste it into a note, email or a Claude chat for a safe copy.${S.backupAt?" Last backup: "+new Date(S.backupAt).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+".":""}</div>
    <div class="row"><button class="btn" data-act="copy">Copy backup</button><button class="btn ghost" data-act="showrestore">Restore from backup</button></div>
    ${S.confirm==="restore"?`<textarea id="restore" placeholder="Paste backup text here"></textarea><button class="btn primary" data-act="restore">Restore rounds</button>`:""}
    <textarea id="bk" readonly hidden></textarea>
  </div><div class="note" style="text-align:center">App version ${APP_VERSION}</div></div>`;
  return h;
}

/* ---------- actions ---------- */
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1800)}
function backupText(){return JSON.stringify({app:"brae-loch-card",v:2,rounds:liveRounds(),courses:S.courses,guests:S.guests})}
document.addEventListener("submit",e=>{
  if(e.target.id!=="addp") return; e.preventDefault();
  const v=document.getElementById("pname").value.trim();
  if(v&&S.newPlayers.length<3&&v.toLowerCase()!==ME.toLowerCase()&&!S.newPlayers.includes(v)){S.newPlayers.push(v);render();document.getElementById("pname")?.focus()}
});
document.addEventListener("input",e=>{if(e.target.id==="cname")S.blankName=e.target.value});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, a=active();
  if(act==="go"){S.view=el.dataset.v; S.viewId=null; S.confirm=null; if(S.view==="hole"&&a){const n=a.holes.findIndex(x=>x.s==null); S.hole=n<0?Math.min(S.hole,nHoles(a)-1):n} render(); scrollTo(0,0)}
  else if(act==="setme"){const first=!ME; if(setMyName(document.getElementById("mename").value)){render();toast(first?"Welcome, "+ME:"Name saved")}}
  else if(act==="pick"){S.pick=el.dataset.v;LS.set("bl_pick",S.pick);render()}
  else if(act==="tees"){S.tees=el.dataset.v;LS.set("bl_tees",S.tees);S.teePick[S.pick]=el.dataset.v;LS.set("bl_teepick",S.teePick);render()}
  else if(act==="bholes"){S.blankHoles=+el.dataset.v;render()}
  else if(act==="rmp"){S.newPlayers.splice(+el.dataset.i,1);render()}
  else if(act==="addn"){if(S.newPlayers.length<3&&!S.newPlayers.includes(el.dataset.n))S.newPlayers.push(el.dataset.n);render()}
  else if(act==="start"){const cn=document.getElementById("cname");if(cn)S.blankName=cn.value;newRound();S.blankName="";S.view="hole";render();scrollTo(0,0)}
  else if(act==="hole"&&a){S.hole=Math.max(0,Math.min(nHoles(a)-1,S.hole+ +el.dataset.d));S.more={};render();scrollTo(0,0)}
  else if(act==="jump"&&a){S.hole=+el.dataset.i;S.more={};S.view="hole";render();scrollTo(0,0)}
  else if(act==="par"&&a){const c=cardOf(a);if(c.blank){c.par[S.hole]=+el.dataset.v;touch(a);render()}}
  else if(act==="more"){const k=+el.dataset.k;S.more[k]=!S.more[k];render()}
  else if(act==="step"&&a){
    const hd=a.holes[S.hole], k=el.dataset.k, d=+el.dataset.d, par=parOf(a,S.hole);
    let get,set,kind;
    if(k==="s"||k==="p"||k==="pen"){kind=k;get=()=>hd[k];set=v=>hd[k]=v}
    else if(/^o\d$/.test(k)){const j=+k.slice(1);kind="s";if(!hd.o)hd.o=[];get=()=>hd.o[j];set=v=>hd.o[j]=v}
    else if(/^gp\d$/.test(k)){const g=gx(hd,+k.slice(2));kind="p";get=()=>g.p;set=v=>g.p=v}
    else if(/^gpen\d$/.test(k)){const g=gx(hd,+k.slice(4));kind="pen";get=()=>g.pen;set=v=>g.pen=v}
    else return;
    let v=get();
    if(v==null){ v = kind==="s" ? (d>0?par:par-1) : (kind==="p"?(d>0?2:1):(d>0?1:0)); }
    else { v+=d; const min=kind==="s"?1:0; if(v<min){ v = kind==="pen"?0:null; } }
    if(v!=null&&v>15) v=15;
    set(v); touch(a); render();
  }
  else if(act==="seg"&&a){
    const hd=a.holes[S.hole], k=el.dataset.k, v=el.dataset.v;
    if(k==="ts") hd.ts=hd.ts===v?null:v;
    else if(/^gts\d$/.test(k)){const g=gx(hd,+k.slice(3));g.ts=g.ts===v?null:v}
    touch(a);render();
  }
  else if(act==="finish"&&a){a.status="done";touch(a);S.viewId=a.id;S.view="card";render();toast("Round saved");scrollTo(0,0)}
  else if(act==="open"){S.viewId=el.dataset.id;S.view="card";S.confirm=null;render();scrollTo(0,0)}
  else if(act==="reopen"){const r=S.rounds[S.viewId]; if(a&&a.id!==r.id){toast("Finish your current round first");return} r.status="active";touch(r);S.viewId=null;S.hole=0;S.more={};S.view="hole";render();scrollTo(0,0)}
  else if(act==="savecourse"){
    const r=S.rounds[el.dataset.id]; const name=(document.getElementById("scname").value||"").trim();
    if(!name){toast("Give the course a name");return}
    const id="c"+Date.now().toString(36);
    S.courses[id]={id,name,place:(document.getElementById("scplace").value||"").trim(),par:cardOf(r).par.slice(),hcp:null,tees:{},createdAt:Date.now()};
    saveCourses(); r.course=id; r.card.name=name; r.card.place=S.courses[id].place; r.card.blank=false; touch(r); render(); toast(name+" saved");
  }
  else if(act==="askdel"){S.confirm="del"+el.dataset.id;render()}
  else if(act==="cancel"){S.confirm=null;render()}
  else if(act==="del"){const r=S.rounds[el.dataset.id];r.deleted=true;r.status="done";touch(r);S.confirm=null;S.viewId=null;S.view="home";render();toast("Round deleted")}
  else if(act==="filter"){S.filter=el.dataset.v;render()}
  else if(act==="sfilter"){S.sFilter=el.dataset.v;render()}
  else if(act==="srange"){S.sRange=el.dataset.v;render()}
  else if(act==="guest"){S.guestName=el.dataset.n;S.view="player";S.confirm=null;render();scrollTo(0,0)}
  else if(act==="gback"){S.view="players";S.confirm=null;render();scrollTo(0,0)}
  else if(act==="grename"){
    const from=S.guestName, to=(el.dataset.to||document.getElementById("gname").value||"").trim();
    if(!to||to===from){toast("Type a new name");return}
    if(to.toLowerCase()===ME.toLowerCase()){toast("That name is taken by you");return}
    if(allGuestNames().includes(to)&&S.confirm!=="merge:"+to){S.confirm="merge:"+to;render();return}
    const res=renameGuest(from,to); S.guestName=to; S.confirm=null; render();
    toast(res.skipped?`Done. ${plural(res.skipped,"round")} had both names and were left alone`:(res.merged?"Players merged":"Name changed"));
  }
  else if(act==="ghcp"){
    const v=(document.getElementById("ghcp").value||"").trim(); const g=S.gprof[S.guestName]||(S.gprof[S.guestName]={});
    if(v===""){delete g.hcp}else{const n=parseFloat(v); if(isNaN(n)||n<-10||n>54){toast("Handicap index is a number from -10 to 54");return} g.hcp=Math.round(n*10)/10}
    LS.set("bl_gprof",S.gprof); render(); toast("Handicap saved");
  }
  else if(act==="ghide"){const n=S.guestName; if(S.guests.includes(n)) S.guests=S.guests.filter(x=>x!==n); else S.guests.push(n); saveGuests(); render()}
  else if(act==="gcancel"){S.confirm=null;render()}
  else if(act==="copy"){
    const txt=backupText();
    const mark=()=>{S.backupAt=Date.now();LS.set("bl_backup_at",S.backupAt)};
    try{await navigator.clipboard.writeText(txt);mark();toast("Backup copied");render()}
    catch(err){const ta=document.getElementById("bk");ta.hidden=false;ta.value=txt;ta.select();mark();toast("Select all and copy")}
  }
  else if(act==="showrestore"){S.confirm=S.confirm==="restore"?null:"restore";render()}
  else if(act==="restore"){
    try{
      const j=JSON.parse(document.getElementById("restore").value);let n=0;
      (j.rounds||[]).forEach(r=>{if(r&&r.id&&Array.isArray(r.holes)){const loc=S.rounds[r.id];if(!loc||(r.updatedAt||0)>(loc.updatedAt||0)){S.rounds[r.id]=r;S.pending.add(r.id);n++}}});
      saveLocal();
      if(j.courses&&typeof j.courses==="object"){Object.values(j.courses).forEach(c=>{if(c&&c.id&&Array.isArray(c.par)&&!S.courses[c.id])S.courses[c.id]=c});saveCourses()}
      if(Array.isArray(j.guests)){j.guests.forEach(g=>{if(g&&!S.guests.includes(g))S.guests.push(g)});}
      liveRounds().forEach(r=>(r.players||[]).slice(1).forEach(p=>{if(p&&!S.guests.includes(p))S.guests.push(p)}));saveGuests();
      S.confirm=null;render();toast(n+" round"+(n===1?"":"s")+" restored");
    }catch(err){toast("That text isn't a valid backup")}
  }
});
if(active()){const a=active();const n=a.holes.findIndex(x=>x.s==null);S.hole=n<0?nHoles(a)-1:n}
render();
</script>
</body></html>
