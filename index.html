<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1D6A3A"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D6A3A'/%3E%3Cpath d='M26 12v40' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M28 13l20 8-20 8z' fill='%23E27B1E'/%3E%3Cellipse cx='32' cy='52' rx='16' ry='4' fill='%234FAE67'/%3E%3C/svg%3E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF1E8; --surface:#FFFFFF; --surface-2:#E2E8DC; --ink:#142018; --muted:#58685C; --line:#C9D3C3;
  --accent:#1D6A3A; --accent-ink:#FFFFFF; --accent-soft:#D5E8D9;
  --tee:#E27B1E; --tee-y:#E8C21C; --tee-b:#2F8FD0;
  --rough:#A9CBA0; --fair:#86C07A; --green:#4FAE67; --sand:#EAD8A3; --water:#4A8FCB; --mapline:#FFFFFF;
  --good:#1D6A3A; --warn:#B8621B; --bad:#A63A2E;
  --font-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --font-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1611; --surface:#16211A; --surface-2:#1E2B22; --ink:#E6EEE5; --muted:#98A99B; --line:#2B3A2F;
  --accent:#57C47A; --accent-ink:#06140B; --accent-soft:#1D3A26;
  --rough:#1F3B25; --fair:#2C5733; --green:#3E9656; --sand:#A99661; --water:#2E6A9C; --mapline:#E6EEE5;
  --good:#57C47A; --warn:#E39A52; --bad:#E07565;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1611; --surface:#16211A; --surface-2:#1E2B22; --ink:#E6EEE5; --muted:#98A99B; --line:#2B3A2F;
  --accent:#57C47A; --accent-ink:#06140B; --accent-soft:#1D3A26;
  --rough:#1F3B25; --fair:#2C5733; --green:#3E9656; --sand:#A99661; --water:#2E6A9C; --mapline:#E6EEE5;
  --good:#57C47A; --warn:#E39A52; --bad:#E07565;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
h1,h2,h3{font-family:var(--font-d);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;line-height:1}
h2{font-size:22px}
.eyebrow{font-family:var(--font-d);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--font-d);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:disabled{opacity:.45;cursor:default}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.wait{background:var(--warn)} .dot.off{background:var(--bad)}

/* tees chooser */
.tees{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.teeopt{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px}
.teeopt[aria-pressed="true"]{border-color:var(--ink)}
.teechip{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid rgba(0,0,0,.2)}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);font-weight:500;min-height:38px}
.chip.x{padding-right:8px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-d);font-size:28px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* rounds list */
.rlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.ritem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.ritem:last-child{border-bottom:0}
.ritem .score{font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1;grid-row:span 2;align-self:center;font-variant-numeric:tabular-nums}
.ritem small{color:var(--muted)}

/* hole view */
.holehead{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}
.holehead .mid{text-align:center}
.holenum{font-family:var(--font-d);font-size:40px;font-weight:700;line-height:.9}
.nav{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700}
.facts{display:flex;justify-content:center;gap:14px;font-family:var(--font-d);font-size:17px;font-weight:600;color:var(--muted)}
.facts b{color:var(--ink)}
.mapwrap{position:relative;border-radius:16px;overflow:hidden;background:var(--rough);border:1px solid var(--line);height:min(54vh,470px);touch-action:manipulation}
.mapwrap svg{display:block;width:100%;height:100%}
.yd{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;gap:12px;align-items:flex-end}
.yd .c{font-family:var(--font-d);font-size:40px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.yd .fb{display:flex;flex-direction:column;font-family:var(--font-d);font-size:15px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.yd .fb span{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
.maptools{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{background:var(--surface);color:var(--ink);border:0;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.18);text-decoration:none;display:inline-block}
.hint{position:absolute;right:10px;top:10px;max-width:40%;text-align:right;font-size:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:6px 8px}
.hz{display:flex;flex-wrap:wrap;gap:6px}
.hz span{font-size:13px;background:var(--surface-2);border-radius:8px;padding:5px 8px}
.hz i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}

.entry{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.erow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .lbl{font-weight:600}
.erow .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.me{background:var(--accent-soft)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:600;line-height:1}
.stepper output{min-width:48px;text-align:center;font-family:var(--font-d);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.stepper.sm button{width:42px;height:42px;font-size:20px}
.stepper.sm output{min-width:40px;font-size:26px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:42px;font-size:13px;font-weight:600;padding:4px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seglbl{padding:10px 12px 0;font-weight:600}

/* scorecard */
.cardscroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.sc{border-collapse:collapse;font-family:var(--font-d);font-variant-numeric:tabular-nums;font-size:16px;min-width:100%}
.sc th,.sc td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 4px;text-align:center;min-width:32px}
.sc th:first-child,.sc td:first-child{text-align:left;padding-left:10px;min-width:74px;position:sticky;left:0;background:var(--surface);font-weight:600;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.sc tr.h th{background:var(--ink);color:var(--bg)}
.sc tr.h th:first-child{background:var(--ink)}
.sc tr.o td{color:var(--muted);font-size:14px}
.sc tr.mine td{font-weight:700;font-size:18px}
.sc td.tot{font-weight:700;background:var(--surface-2)}
.sc td.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.mk{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center}
.mk.bird{border:2px solid var(--good);border-radius:50%}
.mk.eagle{border:2px solid var(--good);border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--good)}
.mk.bog{border:1.5px solid var(--muted)}
.mk.dbl{border:1.5px solid var(--bad);color:var(--bad)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.bar nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:560px}
.bar button{border:0;background:transparent;border-radius:10px;padding:8px 4px;font-family:var(--font-d);font-size:16px;font-weight:600;letter-spacing:.04em;color:var(--muted);min-height:48px}
.bar button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.bar button:disabled{opacity:.35}
.confirm{border:1px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;font-size:14px}
@media (prefers-reduced-motion:no-preference){.btn,.stepper button,.seg button{transition:transform .08s}.btn:active,.stepper button:active,.seg button:active{transform:scale(.96)}}
</style>

<div id="app"></div>
<div class="bar"><nav id="nav" aria-label="Sections"></nav></div>
<div id="toast" class="toast" hidden></div>

/* ---------- geometry ---------- */
const LAT0=42.3495, LON0=-88.0093, KX=111320*Math.cos(LAT0*Math.PI/180), KY=110574, YD=1.09361;
const toXY=(lat,lon)=>[(lon-LON0)*KX,(lat-LAT0)*KY];
const toLL=([x,y])=>[y/KY+LAT0,x/KX+LON0];
const parse=s=>s.split(" ").map(p=>{const [a,b]=p.split(",").map(Number);return toXY(a,b)});
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const HOLES=[];
for(let i=1;i<=18;i++){
  const g=GEO[i]; const path=parse(g.path); const green=parse(g.green);
  const center=[green.reduce((s,p)=>s+p[0],0)/green.length,green.reduce((s,p)=>s+p[1],0)/green.length];
  const tee=path[0], pin=path[path.length-1];
  const phi=Math.atan2(pin[0]-tee[0],pin[1]-tee[1]);
  HOLES.push({path,green,center,tee,phi,
    hz:g.hz.map(s=>({t:s[0],poly:parse(s.slice(2))})),
    tees:(g.tees||[]).map(parse), fw:g.fw?parse(g.fw):null});
}
function rot(h,p){const x=p[0]-h.tee[0],y=p[1]-h.tee[1],c=Math.cos(h.phi),s=Math.sin(h.phi);return [x*c-y*s,x*s+y*c]}
function unrot(h,q){const c=Math.cos(h.phi),s=Math.sin(h.phi);return [q[0]*c+q[1]*s+h.tee[0],-q[0]*s+q[1]*c+h.tee[1]]}
function yardsInfo(h,ball){
  const d=dist(ball,h.center); const u=d>0.5?[(h.center[0]-ball[0])/d,(h.center[1]-ball[1])/d]:[0,1];
  let mn=1e9,mx=-1e9; h.green.forEach(p=>{const pr=(p[0]-h.center[0])*u[0]+(p[1]-h.center[1])*u[1]; mn=Math.min(mn,pr); mx=Math.max(mx,pr)});
  const hz=[]; const seen=new Set();
  h.hz.forEach(z=>{
    const key=z.poly[0].join(); if(seen.has(key)) return; seen.add(key);
    let near=1e9,far=0,ahead=false;
    z.poly.forEach(p=>{const dd=dist(ball,p); near=Math.min(near,dd); far=Math.max(far,dd); if((p[0]-ball[0])*u[0]+(p[1]-ball[1])*u[1]>0) ahead=true});
    if(ahead && near < d+mx+15) hz.push({t:z.t,near:near*YD,far:far*YD});
  });
  hz.sort((a,b)=>a.near-b.near);
  return {c:d*YD,f:Math.max(0,d+mn)*YD,b:(d+mx)*YD,hz:hz.slice(0,4)};
}

let syncTimer=null, flushing=false;
function touch(r){r.updatedAt=Date.now();S.pending.add(r.id);saveLocal();clearTimeout(syncTimer);syncTimer=setTimeout(flush,1200);setSync(S.db?"wait":"local")}
async function flush(){
  if(!S.db||flushing) return; flushing=true;
  try{
    for(const id of [...S.pending]){
      const r=S.rounds[id]; if(!r){S.pending.delete(id);continue}
      try{await S.db.doc("rounds/"+id).set(JSON.parse(JSON.stringify(r)));S.pending.delete(id);saveLocal()}
      catch(e){setSync("off");clearTimeout(syncTimer);syncTimer=setTimeout(flush,15000);flushing=false;return}
    }
    setSync("ok");
  } finally{flushing=false}
}

(async()=>{

      Object.values(S.rounds).forEach(r=>{if(!snap.docs.find(d=>d.id===r.id)) S.pending.add(r.id)});

function newRound(){

    createdAt:Date.now(),updatedAt:Date.now()};
  S.rounds[id]=r; S.newPlayers=[]; S.hole=0; touch(r); return r;
}
const played=r=>r.holes.filter(h=>h.s!=null).length;
const myTotal=r=>r.holes.reduce((a,h)=>a+(h.s||0),0);
const parThru=r=>r.holes.reduce((a,h,i)=>a+(h.s!=null?COURSE.par[i]:0),0);
const toPar=n=>n===0?"E":(n>0?"+"+n:"−"+Math.abs(n));
const oTotal=(r,k)=>r.holes.reduce((a,h)=>a+(h.o[k]||0),0);
const complete=r=>r.holes.every(h=>h.s!=null);
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})}

/* handicap (WHS method, unofficial) */
function hiFrom(diffs){
  const n=diffs.length; if(n<3) return null;
  const last=diffs.slice(-20).slice().sort((a,b)=>a-b);
  const t={3:[1,-2],4:[1,-1],5:[1,0],6:[2,-1],7:[2,0],8:[2,0],9:[3,0],10:[3,0],11:[3,0],12:[4,0],13:[4,0],14:[4,0],15:[5,0],16:[5,0],17:[6,0],18:[6,0],19:[7,0]};
  const [k,adj]=t[Math.min(n,20)]||[8,0];
  const avg=last.slice(0,k).reduce((a,b)=>a+b,0)/k;
  return Math.min(54,Math.round((avg+adj)*10)/10);
}
function courseHcp(hi,tees){const t=COURSE.tees[tees];if(hi==null||!t.rating)return null;return Math.round(hi*t.slope/113+(t.rating-PAR_TOTAL))}
function strokesOn(ch,i){if(ch==null)return 0;const idx=COURSE.hcpM[i];let s=Math.floor(ch/18);if(idx<=ch%18)s++;return s}
function handicapHistory(){
  const done=liveRounds().filter(r=>r.status==="done"&&complete(r)&&COURSE.tees[r.tees].rating).sort((a,b)=>a.date.localeCompare(b.date));
  const diffs=[]; const byId={};
  done.forEach(r=>{
    const hi=hiFrom(diffs); const ch=courseHcp(hi,r.tees); const t=COURSE.tees[r.tees];
    const ags=r.holes.reduce((a,h,i)=>{const cap=hi==null?COURSE.par[i]+5:COURSE.par[i]+2+strokesOn(ch,i);return a+Math.min(h.s,cap)},0);
    const d=Math.round((113/t.slope)*(ags-t.rating)*10)/10; diffs.push(d); byId[r.id]={ags,diff:d};
  });
  return {hi:hiFrom(diffs),byId,count:diffs.length};
}
function myStats(){
  const rs=liveRounds().filter(r=>r.status==="done"&&complete(r));
  if(!rs.length) return null;
  const scores=rs.map(myTotal); const n=rs.length;
  let putts=0,pr=0,three=0,pen=0,fwHit=0,fwTot=0;
  rs.forEach(r=>{ if(r.holes.every(h=>h.p!=null)){pr++;putts+=r.holes.reduce((a,h)=>a+h.p,0)}
    r.holes.forEach((h,i)=>{if(h.p>=3)three++;pen+=h.pen||0;if(COURSE.par[i]>3&&h.ts){fwTot++;if(h.ts==="F")fwHit++}})});
  return {n,best:Math.min(...scores),avg:scores.reduce((a,b)=>a+b,0)/n,putts:pr?putts/pr:null,three:three/n,pen:pen/n,fw:fwTot?fwHit/fwTot:null};
}
function holeAvg(i){const v=liveRounds().filter(r=>r.status==="done").map(r=>r.holes[i].s).filter(x=>x!=null);return v.length?{avg:v.reduce((a,b)=>a+b,0)/v.length,n:v.length}:null}

function mapSVG(H,ball){
  const pts=[...H.path,...H.green,...H.hz.flatMap(z=>z.poly),...H.tees.flat(),ball].map(p=>rot(H,p));
  let x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0])),y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1]));
  const pad=22; x0-=pad;x1+=pad;y0-=pad;y1+=pad;
  let w=x1-x0,hgt=y1-y0; const minW=hgt*0.55; if(w<minW){const c=(x0+x1)/2;x0=c-minW/2;x1=c+minW/2;w=minW}
  const P=p=>{const q=rot(H,p);return [q[0],-q[1]]};
  const poly=arr=>arr.map(p=>P(p).map(n=>n.toFixed(1)).join(",")).join(" ");
  const fs=Math.max(8,w/13);
  const b=P(ball), c=P(H.center);
  const mid=[(b[0]+c[0])/2,(b[1]+c[1])/2];
  const pin=P(H.path[H.path.length-1]);
  return `<svg id="map" viewBox="${x0.toFixed(1)} ${(-y1).toFixed(1)} ${w.toFixed(1)} ${hgt.toFixed(1)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Hole ${S.hole+1} map">
    <rect x="${x0-500}" y="${-y1-500}" width="${w+1000}" height="${hgt+1000}" fill="var(--rough)"/>
    <polyline points="${poly(H.path)}" fill="none" stroke="var(--fair)" stroke-width="${Math.max(24,w*0.16).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/>
    ${H.fw?`<polygon points="${poly(H.fw)}" fill="var(--fair)"/>`:""}
    ${H.tees.map(t=>`<polygon points="${poly(t)}" fill="var(--fair)" stroke="var(--mapline)" stroke-opacity=".7" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("")}
    ${H.hz.map(z=>`<polygon points="${poly(z.poly)}" fill="${z.t==="w"?"var(--water)":"var(--sand)"}"/>`).join("")}
    <polygon points="${poly(H.green)}" fill="var(--green)" stroke="var(--mapline)" stroke-opacity=".6" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <line x1="${pin[0].toFixed(1)}" y1="${pin[1].toFixed(1)}" x2="${pin[0].toFixed(1)}" y2="${(pin[1]-fs*1.6).toFixed(1)}" stroke="var(--mapline)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <polygon points="${pin[0].toFixed(1)},${(pin[1]-fs*1.6).toFixed(1)} ${(pin[0]+fs*0.9).toFixed(1)},${(pin[1]-fs*1.3).toFixed(1)} ${pin[0].toFixed(1)},${(pin[1]-fs).toFixed(1)}" fill="var(--bad)"/>
    <line x1="${b[0].toFixed(1)}" y1="${b[1].toFixed(1)}" x2="${c[0].toFixed(1)}" y2="${c[1].toFixed(1)}" stroke="var(--mapline)" stroke-width="2" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>
    <circle cx="${b[0].toFixed(1)}" cy="${b[1].toFixed(1)}" r="${(fs*0.45).toFixed(1)}" fill="#fff" stroke="#142018" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg>`;
}
function bindMap(){
  const svg=document.getElementById("map"); if(!svg) return;
  svg.addEventListener("click",e=>{
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const q=pt.matrixTransform(svg.getScreenCTM().inverse());
    S.balls[S.hole]=unrot(HOLES[S.hole],[q.x,-q.y]); render();
  });
}

function cardView(r){
  if(!r) return header()+`<div class="section panel">No round selected.</div>`;
  const t=COURSE.tees[r.tees]; const isActive=r.status==="active";
  const hc=handicapHistory(); const d=hc.byId[r.id];
  const half=(from)=>{
    const idx=[...Array(9)].map((_,k)=>k+from);
    const sum=(f)=>idx.reduce((a,i)=>a+(f(i)||0),0);
    const cell=(i,v)=>`<td class="${isActive&&i===S.hole?"cur":""}">${v}</td>`;
    const mk=(i,s)=>{if(s==null)return "";const df=s-COURSE.par[i];const c=df<=-2?"eagle":df===-1?"bird":df===1?"bog":df>=2?"dbl":"";return `<span class="mk ${c}">${s}</span>`};
    return `<div class="cardscroll"><table class="sc">
      <tr class="h"><th>Hole</th>${idx.map(i=>`<th>${i+1}</th>`).join("")}<th>${from?"In":"Out"}</th></tr>
      <tr class="o"><td>${t.label}</td>${idx.map(i=>`<td>${t.yards[i]}</td>`).join("")}<td class="tot">${sum(i=>t.yards[i])}</td></tr>
      <tr class="o"><td>Hcp</td>${idx.map(i=>`<td>${COURSE.hcpM[i]}</td>`).join("")}<td class="tot"></td></tr>
      <tr><td>Par</td>${idx.map(i=>`<td>${COURSE.par[i]}</td>`).join("")}<td class="tot">${sum(i=>COURSE.par[i])}</td></tr>
      <tr class="mine"><td>${ME}</td>${idx.map(i=>cell(i,mk(i,r.holes[i].s))).join("")}<td class="tot">${sum(i=>r.holes[i].s)||""}</td></tr>
      <tr class="o"><td>Putts</td>${idx.map(i=>`<td>${r.holes[i].p??""}</td>`).join("")}<td class="tot">${sum(i=>r.holes[i].p)||""}</td></tr>
      ${r.players.slice(1).map((p,k)=>`<tr><td>${esc(p)}</td>${idx.map(i=>`<td>${r.holes[i].o[k]??""}</td>`).join("")}<td class="tot">${sum(i=>r.holes[i].o[k])||""}</td></tr>`).join("")}
    </table></div>`;
  };
  const n=played(r);
  let h=header(`${fmtDate(r.date)} · ${t.label} tees`);
  h+=`<div class="section"><div class="stats">
    <div class="stat"><b>${n?myTotal(r):"–"}</b><span>${ME}${complete(r)?"":" thru "+n}</span></div>
    <div class="stat"><b>${n?toPar(myTotal(r)-parThru(r)):"–"}</b><span>To par</span></div>
    <div class="stat"><b>${r.holes.some(x=>x.p!=null)?r.holes.reduce((a,x)=>a+(x.p||0),0):"–"}</b><span>Putts</span></div>
  </div>${d?`<div class="note">Handicap differential for this round: <b>${d.diff}</b> (adjusted score ${d.ags}).</div>`:""}</div>`;
  h+=`<div class="section">${half(0)}${half(9)}</div>`;
  if(r.players.length>1) h+=`<div class="section"><div class="rlist">${r.players.map((p,k)=>{const tot=k===0?myTotal(r):oTotal(r,k-1);return `<div class="ritem" style="cursor:default"><strong>${esc(p)}</strong><div class="score">${tot||"–"}</div><small>${tot?toPar(tot-parThru(r)):""}</small></div>`}).join("")}</div></div>`;
  h+=`<div class="section">`;
  if(isActive){
    h+=complete(r)?`<button class="btn primary block" data-act="finish">Finish round and save</button>`:`<button class="btn block" data-act="finish">Finish round early (${n} of 18)</button><div class="note">Rounds with all 18 holes count toward your handicap.</div>`;
  } else {
    h+=`<button class="btn block" data-act="reopen">Edit this round</button>`;
  }
  if(S.confirm==="del"+r.id) h+=`<div class="confirm"><strong>Delete this round?</strong><span class="note">It's removed from your history and stats.</span><div class="row"><button class="btn danger" data-act="del" data-id="${r.id}">Delete round</button><button class="btn ghost" data-act="cancel">Keep it</button></div></div>`;
  else h+=`<button class="btn ghost block" data-act="askdel" data-id="${r.id}" style="color:var(--bad)">Delete round</button>`;
  h+=`</div>`;
  return h;
}

function historyView(){
  const rs=liveRounds().filter(r=>r.status==="done").sort((a,b)=>b.date.localeCompare(a.date));
  let h=header("History");
  const hc=handicapHistory();
  h+=`<div class="section"><div class="stats"><div class="stat"><b>${rs.length}</b><span>Rounds</span></div><div class="stat"><b>${rs.filter(r=>complete(r)).length?Math.min(...rs.filter(complete).map(myTotal)):"—"}</b><span>Best 18</span></div><div class="stat"><b>${hc.hi!=null?hc.hi.toFixed(1):"—"}</b><span>Handicap*</span></div></div></div>`;
  h+=`<div class="section">${rs.length?roundList(rs):`<div class="panel muted">No finished rounds yet.</div>`}</div>`;
  if(rs.length){
    h+=`<div class="section"><div class="eyebrow">Your average by hole</div><div class="cardscroll"><table class="sc"><tr class="h"><th>Hole</th>${COURSE.par.map((_,i)=>`<th>${i+1}</th>`).join("")}</tr><tr><td>Par</td>${COURSE.par.map(p=>`<td>${p}</td>`).join("")}</tr><tr class="mine"><td>Avg</td>${COURSE.par.map((p,i)=>{const a=holeAvg(i);return `<td style="${a&&a.avg-p>=2?"color:var(--bad)":""}">${a?a.avg.toFixed(1):""}</td>`}).join("")}</tr></table></div><div class="note">Red marks holes where you average double bogey or worse.</div></div>`;
  }
  h+=`<div class="section"><div class="eyebrow">Backup</div><div class="panel stack">
    <div class="note">Rounds save to your Claude account and to this phone. For an extra copy, copy the backup text and paste it into a note or email.</div>
    <div class="row"><button class="btn" data-act="copy">Copy backup</button><button class="btn ghost" data-act="showrestore">Restore from backup</button></div>
    ${S.confirm==="restore"?`<textarea id="restore" placeholder="Paste backup text here"></textarea><button class="btn primary" data-act="restore">Restore rounds</button>`:""}
    <textarea id="bk" readonly hidden></textarea>
  </div></div>`;
  return h;
}

/* ---------- actions ---------- */
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1800)}
document.addEventListener("submit",e=>{
  if(e.target.id!=="addp") return; e.preventDefault();
  const v=document.getElementById("pname").value.trim();
  if(v&&S.newPlayers.length<3&&v.toLowerCase()!==ME.toLowerCase()){S.newPlayers.push(v);render();document.getElementById("pname")?.focus()}
});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, a=active();
  if(act==="go"){S.view=el.dataset.v; if(S.view!=="card") S.viewId=null; if(S.view==="card"&&a) S.viewId=null; S.confirm=null; if(S.view==="hole"&&a){const n=a.holes.findIndex(x=>x.s==null); if(S.hole==null) S.hole=Math.max(0,n)} render(); scrollTo(0,0)}
  else if(act==="tees"){S.tees=el.dataset.v;LS.set("bl_tees",S.tees);render()}
  else if(act==="rmp"){S.newPlayers.splice(+el.dataset.i,1);render()}
  else if(act==="addn"){if(S.newPlayers.length<3)S.newPlayers.push(el.dataset.n);render()}
  else if(act==="start"){newRound();S.balls={};S.view="hole";render();scrollTo(0,0)}
  else if(act==="hole"){S.hole=Math.max(0,Math.min(17,S.hole+ +el.dataset.d));render();scrollTo(0,0)}
  else if(act==="resetball"){delete S.balls[S.hole];render()}
  else if(act==="step"&&a){
    const hd=a.holes[S.hole], k=el.dataset.k, d=+el.dataset.d, par=COURSE.par[S.hole];
    const get=()=>k[0]==="o"&&k!=="o"?hd.o[+k.slice(1)]:hd[k];
    const set=v=>{if(k[0]==="o")hd.o[+k.slice(1)]=v;else hd[k]=v};
    let v=get();
    if(v==null){ v = k==="s"||k[0]==="o" ? (d>0?par:par-1) : (k==="p"?(d>0?2:1):0); }
    else { v+=d; const min=k==="s"||k[0]==="o"?1:0; if(v<min){ v = (k==="pen")?0:null; } }
    if(v!=null&&v>15) v=15;
    set(v); touch(a); render();
  }
  else if(act==="ts"&&a){const hd=a.holes[S.hole];hd.ts=hd.ts===el.dataset.v?null:el.dataset.v;touch(a);render()}
  else if(act==="finish"&&a){a.status="done";touch(a);S.viewId=a.id;S.view="card";render();toast("Round saved");scrollTo(0,0)}
  else if(act==="open"){S.viewId=el.dataset.id;S.view="card";S.confirm=null;render();scrollTo(0,0)}
  else if(act==="reopen"){const r=S.rounds[S.viewId]; if(a&&a.id!==r.id){toast("Finish your current round first");return} r.status="active";touch(r);S.viewId=null;S.hole=0;S.view="hole";render();scrollTo(0,0)}
  else if(act==="askdel"){S.confirm="del"+el.dataset.id;render()}
  else if(act==="cancel"){S.confirm=null;render()}
  else if(act==="del"){const r=S.rounds[el.dataset.id];r.deleted=true;r.status="done";touch(r);S.confirm=null;S.viewId=null;S.view="home";render();toast("Round deleted")}
  else if(act==="copy"){
    const txt=JSON.stringify({app:"brae-loch-card",v:1,rounds:liveRounds()});
    try{await navigator.clipboard.writeText(txt);toast("Backup copied")}
    catch(err){const ta=document.getElementById("bk");ta.hidden=false;ta.value=txt;ta.select();toast("Select all and copy")}
  }
  else if(act==="showrestore"){S.confirm=S.confirm==="restore"?null:"restore";render()}
  else if(act==="restore"){
    try{const j=JSON.parse(document.getElementById("restore").value);let n=0;(j.rounds||[]).forEach(r=>{if(r&&r.id&&r.holes){const loc=S.rounds[r.id];if(!loc||(r.updatedAt||0)>(loc.updatedAt||0)){S.rounds[r.id]=r;touch(r);n++}}});S.confirm=null;render();toast(n+" round"+(n===1?"":"s")+" restored")}
    catch(err){toast("That text isn't a valid backup")}
  }
});
if(active()){const a=active();const n=a.holes.findIndex(x=>x.s==null);S.hole=n<0?17:n}
render();
</script>
